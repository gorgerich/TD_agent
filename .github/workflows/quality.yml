name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: td_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d td_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/td_agent_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/td_agent_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/td_agent_test
      APP_ENCRYPTION_KEY: ci-only-test-key-not-valid-for-production
      DEMO_MODE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify patch formatting
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Week 2 and M1 legacy backfill fixtures
        run: |
          set -euo pipefail
          MIGRATION_DB=td_agent_migration_test
          ADMIN_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_URL=postgresql://postgres:postgres@127.0.0.1:5432/$MIGRATION_DB
          trap 'psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $MIGRATION_DB WITH (FORCE);"' EXIT
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $MIGRATION_DB WITH (FORCE);"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $MIGRATION_DB"
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260713000000_baseline/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/week2-backfill-fixtures.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714090000_week2_canonical_case/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/week2-backfill-assertions.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260718090000_m1_operations_control_plane/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260719190000_m1_operations_integrity/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m1-operations-assertions.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260726090000_m2_platform_admin_rbac/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260726150000_m2_platform_admin_activation/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260728120000_m2_platform_admin_mfa/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260728130000_m2_platform_admin_activation_revoke/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260728190000_m1_platform_owner_recovery/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m2-admin-assertions.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m2-commercial-fixtures.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260729170000_m2_commercial_trust_loop/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m2-commercial-assertions.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m3-fulfilment-fixtures.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260811172829_m3_fulfilment_money_trust/migration.sql
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f tests/migrations/m3-fulfilment-assertions.sql
      - name: Configure SSI predicate lock granularity
        # Every operational command runs at SERIALIZABLE. With the Postgres default of
        # max_pred_locks_per_page=2, per-tuple predicate locks collapse into a page-level
        # lock as soon as a transaction touches three rows on one page, and transactions
        # against unrelated tenants then conflict purely because their rows share a page.
        # That produces P2034 failures with no real race behind them. Raising the limit
        # keeps locks at tuple granularity; it does not weaken serializability.
        # tests/integration/fixtureIsolation.itest.ts asserts this setting.
        run: |
          set -euo pipefail
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_pred_locks_per_page = 64"
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "SHOW max_pred_locks_per_page"

      - name: Apply migrations to isolated test database
        run: npx prisma migrate deploy
      - name: Verify repeated migration deploy is a no-op
        run: |
          output="$(npx prisma migrate deploy)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'No pending migrations to apply|No pending migrations'
      - name: Verify migration/schema parity
        run: npx prisma migrate diff --from-url "$DATABASE_URL_UNPOOLED" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Repeat M3 concurrency and policy gates five times
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "M3 targeted repeat $attempt/5"
            npm run test:integration -- \
              tests/integration/m3Fulfilment.itest.ts \
              tests/integration/m3PolicyActivation.itest.ts
          done
      - name: Provision isolated M1 browser UAT fixture
        run: |
          set -euo pipefail
          fingerprint="$(npx tsx -e 'import { inspectDirectMigrationUrl } from "./lib/migrationTarget"; process.stdout.write(inspectDirectMigrationUrl(process.env.DATABASE_URL_UNPOOLED).fingerprint)')"
          password="$(openssl rand -base64 36 | tr -d '\n')!Aa9"
          printf '::add-mask::%s\n' "$password"
          {
            printf 'EXPECTED_DATABASE_FINGERPRINT=%s\n' "$fingerprint"
            printf 'M1_UAT_FIXTURE=1\n'
            printf 'M1_UAT_RUN_ID=ci-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'M1_UAT_PASSWORD=%s\n' "$password"
          } >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/m1-uat-ready"
          EXPECTED_DATABASE_FINGERPRINT="$fingerprint" \
          M1_UAT_FIXTURE=1 \
          M1_UAT_RUN_ID="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          M1_UAT_PASSWORD="$password" \
          npx tsx tests/e2e/m1-fixture.ts provision
      - name: Provision isolated M1 RBAC Hardening browser UAT fixture
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 36 | tr -d '\n')!Aa9"
          activation_token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          recovery_token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          mfa_secret="$(node - <<'NODE'
          const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
          const bytes = require("node:crypto").randomBytes(20);
          let bits = 0, value = 0, output = "";
          for (const byte of bytes) {
            value = (value << 8) | byte;
            bits += 8;
            while (bits >= 5) {
              output += alphabet[(value >>> (bits - 5)) & 31];
              bits -= 5;
            }
          }
          process.stdout.write(output);
          NODE
          )"
          printf '::add-mask::%s\n' "$password"
          printf '::add-mask::%s\n' "$activation_token"
          printf '::add-mask::%s\n' "$recovery_token"
          printf '::add-mask::%s\n' "$mfa_secret"
          {
            printf 'M2_UAT_FIXTURE=1\n'
            printf 'M2_UAT_RUN_ID=ci-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'M2_UAT_PASSWORD=%s\n' "$password"
            printf 'M2_UAT_ACTIVATION_TOKEN=%s\n' "$activation_token"
            printf 'M2_UAT_RECOVERY_TOKEN=%s\n' "$recovery_token"
            printf 'M2_UAT_MFA_SECRET=%s\n' "$mfa_secret"
          } >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/m2-uat-ready"
          EXPECTED_DATABASE_FINGERPRINT="$EXPECTED_DATABASE_FINGERPRINT" \
          M2_UAT_FIXTURE=1 \
          M2_UAT_RUN_ID="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          M2_UAT_PASSWORD="$password" \
          M2_UAT_ACTIVATION_TOKEN="$activation_token" \
          M2_UAT_RECOVERY_TOKEN="$recovery_token" \
          M2_UAT_MFA_SECRET="$mfa_secret" \
          npx tsx tests/e2e/m2-fixture.ts provision
      - name: Provision isolated M3 browser UAT fixture
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 36 | tr -d '\n')!Aa9"
          webhook_secret="$(openssl rand -hex 32)"
          mfa_secret="$M2_UAT_MFA_SECRET"
          printf '::add-mask::%s\n' "$password"
          printf '::add-mask::%s\n' "$webhook_secret"
          printf '::add-mask::%s\n' "$mfa_secret"
          {
            printf 'M3_UAT_FIXTURE=1\n'
            printf 'M3_UAT_RUN_ID=ci-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'M3_UAT_PASSWORD=%s\n' "$password"
            printf 'M3_PAYMENT_WEBHOOK_SECRET=%s\n' "$webhook_secret"
            printf 'M3_UAT_MFA_SECRET=%s\n' "$mfa_secret"
          } >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/m3-uat-ready"
          EXPECTED_DATABASE_FINGERPRINT="$EXPECTED_DATABASE_FINGERPRINT" \
          M3_UAT_FIXTURE=1 \
          M3_UAT_RUN_ID="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          M3_UAT_PASSWORD="$password" \
          M3_UAT_MFA_SECRET="$mfa_secret" \
          npx tsx tests/e2e/m3-fixture.ts provision
      - name: Verify encrypted production-like backup and real restore
        run: |
          set -euo pipefail
          umask 077

          RESTORE_DB=td_agent_encrypted_restore_test
          ADMIN_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          RESTORE_URL=postgresql://postgres:postgres@127.0.0.1:5432/$RESTORE_DB
          plain_dump="$RUNNER_TEMP/m3-production-like.dump"
          encrypted_dump="$RUNNER_TEMP/m3-production-like.dump.enc"
          restored_dump="$RUNNER_TEMP/m3-production-like.restore.dump"
          source_counts="$RUNNER_TEMP/m3-source-counts.txt"
          restore_counts="$RUNNER_TEMP/m3-restore-counts.txt"

          cleanup() {
            rm -f "$plain_dump" "$encrypted_dump" "$restored_dump" "$source_counts" "$restore_counts"
            psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RESTORE_DB WITH (FORCE);" >/dev/null
          }
          trap cleanup EXIT

          aggregate_counts() {
            local url="$1"
            while IFS= read -r table_name; do
              local row_count
              row_count="$(psql "$url" -v ON_ERROR_STOP=1 -v table_name="$table_name" -At <<'SQL'
          SELECT count(*) FROM public.:"table_name";
          SQL
              )"
              printf '%s=%s\n' "$table_name" "$row_count"
            done < <(psql "$url" -v ON_ERROR_STOP=1 -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename")
          }

          backup_key="$(openssl rand -base64 48 | tr -d '\n')"
          printf '::add-mask::%s\n' "$backup_key"

          pg_dump --format=custom --no-owner --no-privileges --file="$plain_dump" "$DATABASE_URL_UNPOOLED"
          chmod 600 "$plain_dump"
          pg_restore --list "$plain_dump" >/dev/null
          aggregate_counts "$DATABASE_URL_UNPOOLED" > "$source_counts"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$plain_dump" -out "$encrypted_dump" -pass stdin <<<"$backup_key"
          chmod 600 "$encrypted_dump"
          rm -f "$plain_dump"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_dump" -out "$restored_dump" -pass stdin <<<"$backup_key"
          chmod 600 "$restored_dump"
          pg_restore --list "$restored_dump" >/dev/null

          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RESTORE_DB WITH (FORCE);" >/dev/null
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $RESTORE_DB" >/dev/null
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_URL" "$restored_dump"
          rm -f "$restored_dump"

          aggregate_counts "$RESTORE_URL" > "$restore_counts"
          diff -u "$source_counts" "$restore_counts"
          DATABASE_URL="$RESTORE_URL" DATABASE_URL_UNPOOLED="$RESTORE_URL" \
            npx prisma migrate diff --from-url "$RESTORE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

          test -s "$encrypted_dump"
          test ! -e "$plain_dump"
          test ! -e "$restored_dump"
          echo "Encrypted backup restore, aggregate-count parity, and schema parity: PASS"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.m3-private-storage"
          M3_DOCUMENT_STORAGE=isolated-filesystem \
          M3_DOCUMENT_SCANNER=synthetic-preview \
          PREVIEW_DB_ISOLATION=PASS \
          VERCEL_ENV=preview \
          ALLOW_DB_TESTS=1 \
          npm run start > /tmp/td-agent-next.log 2>&1 &
      - name: Wait for server
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3001/agent/login >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/td-agent-next.log
          exit 1
      - run: npm run test:e2e
      - name: Show server diagnostics after an E2E failure
        if: failure()
        run: test ! -f /tmp/td-agent-next.log || tail -n 200 /tmp/td-agent-next.log
      - name: Cleanup isolated M3 browser UAT fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m3-uat-ready" ]; then
            npx tsx tests/e2e/m3-fixture.ts cleanup
            rm -rf "$GITHUB_WORKSPACE/.m3-private-storage"
          fi
      - name: Cleanup isolated M1 browser UAT fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m1-uat-ready" ]; then
            npx tsx tests/e2e/m1-fixture.ts cleanup
          fi
      - name: Cleanup isolated M1 RBAC Hardening browser UAT fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m2-uat-ready" ]; then
            npx tsx tests/e2e/m2-fixture.ts cleanup
          fi
      - name: Validate authoritative mission evidence
        run: npm run evidence:validate
        env:
          REQUIRED_MISSION_EVIDENCE: M3
          # On a pull_request the checkout leaves HEAD at the merge ref, so the evidence
          # gate would compare the certified SHA against base-merged-into-branch and fail
          # the moment an unrelated commit lands on main. Give it the real PR head.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
