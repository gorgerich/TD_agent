open_blockers:
  - gate: independent_review
    severity: OPEN
    reason: >-
      Round 1 of adversarial review returned 0 P0, 5 P1 and 3 P2. All five P1s and two of
      the three P2s are fixed on this branch. A second round has not been run, so this
      gate cannot be recorded as passed.
  - gate: preview_uat
    severity: TERMINAL_FOR_THIS_SESSION
    reason: >-
      The Vercel project resolves DATABASE_URL and BLOB_READ_WRITE_TOKEN from a single
      "Preview, Production" scope; a branch-scoped override exists only for
      feat/m2-platform-admin-rbac. Running the UAT against the auto-created Preview for
      this branch would write synthetic organizations, quotes and client decisions into
      the production database and blob store, which the authority envelope forbids.
      Needs an isolated Preview database bound to this branch.
  - gate: production_predicate_lock_setting
    severity: OPEN
    reason: >-
      max_pred_locks_per_page = 64 is configured in CI and asserted by the integration
      suite, but has not been verified on the production Neon instance. At the default of
      2 the product returns spurious 409s under concurrency. See release.md.
owner_release_authorization: false
